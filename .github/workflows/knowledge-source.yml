name: knowledge-source

# 知识源仓 CI：生成 → 门禁 → 覆盖矩阵 → 自动发布到 poyinet/crypto
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: knowledge-source
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 知识源的生成依赖主站数据（词汇/章节/实体）
      # ⚠ 架构债：源 ← 站 存在循环依赖（站本应依赖源）。这里先用一并检出主站的方式保证管线一致，
      #    彻底解法是把词表/章节/实体数据收归知识源自身，让主站改为消费源产物。
      - uses: actions/checkout@v4
        with:
          repository: poyinet/www
          ref: main
          path: poyi-site

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci || npm install --no-audit --no-fund

      # ---------- 1. 生成：内容层 + 知识总目录 ----------
      - name: 生成全部内容与知识总目录
        run: node tools/mdgen/gen-all.js
        env:
          POYI_ROOT: ${{ github.workspace }}/poyi-site/assets/js

      # ---------- 2. 门禁：内容等价 ----------
      - name: parity 门禁（源 ↔ 产物逐字段等价）
        run: node tools/mdgen/check-mdgen-parity.js

      # ---------- 3. 门禁：知识总目录 ----------
      - name: 知识总目录门禁
        run: node tools/check/check-inventory.js

      - name: frontmatter 门禁
        run: node tools/check/check-frontmatter.js

      - name: 别名与交叉引用门禁
        run: node tools/check/check-alias.js

      - name: 中英同步门禁
        run: node tools/check/check-i18n-sync.js

      - name: 出处门禁
        run: node tools/check/check-sources.js

      # ---------- 4. 覆盖矩阵（报告）----------
      - name: 生成覆盖矩阵
        run: node tools/check/check-coverage.js

      # ---------- 5. 构建分站 + 分站门禁 ----------
      - name: 构建分站
        run: node tools/site/build.js

      - name: 分站门禁（死链 / 结构 / 体积 / sitemap）
        run: node tools/check/check-site.js

      # ---------- 6. 发布分站产物 ----------
      - name: 发布到 poyinet/crypto
        if: ${{ hashFiles('build/site/**') != '' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.CRYPTO_PUBLISH_TOKEN }}
        run: node tools/oneoff/publish-crypto-repo.js

      - name: 提交构建产物与覆盖矩阵
        run: |
          git config user.name "poyinet-bot"
          git config user.email "poyinet-bot@users.noreply.github.com"
          git add build/ docs/coverage-matrix.md _meta/inventory/ || true
          git diff --staged --quiet || git commit -m "chore(build): 重新生成知识总目录与覆盖矩阵 [skip ci]"
          git push origin HEAD:main

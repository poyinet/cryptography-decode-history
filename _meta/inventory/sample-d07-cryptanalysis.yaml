# ============================================================
# 知识总目录 · 样例：d07 破译方法
# ------------------------------------------------------------
# 本文件是「总目录」格式的评审样例——先看粒度与风格，再批量铺开。
# 
# 格式约定（全部清单通用）：
#   id         全局唯一规范 ID（kebab-case；与实体 frontmatter 的 id 一致）
#   title      中文规范名
#   title_en   英文规范名
#   status     done（已有且成稿） | draft（已起草未核证） | todo（待写） | exempt（明确不收，note 必填）
#   quality    tier1 旗舰级（三层深度 + 结构化出处） | tier2 标准级（摘要 + 出处 + 全轴） | tier3 索引级（定义 + 关联）
#   domain     主归属技术域（可多值 = 交叉域）
#   subtopic   所属子主题（见本文件末尾 subtopics 段）
#   era        所属时代（可多值）
#   level      难度 1 入门 / 2 进阶 / 3 专家 / 4 研究
#   prereq     前置实体 id
#   aliases    别名 / 异译 / 旧称 / 缩写 / 型号别名
#   apps       应用场景轴
#   threats    威胁模型轴
#   playable   是否适合做玩法原型（供主站游戏化预留）
#   archetype  建议的玩法原型
#   sources    结构化出处（kind: primary / authoritative / tertiary）
#   note       补充说明；status=exempt 时必填理由
# 
# 场景轴取值域：military 军事 / diplomacy 外交 / finance 金融 / telecom 通信 /
#               privacy 隐私 / law-enforcement 执法 / copyright 版权 / academic 学术 /
#               everyday 日常 / counter-terror 反恐 / infrastructure 基建 / health 医疗
# 
# 威胁模型轴取值域：CO / KPA / CPA / CCA / CCA1 / CCA2 / adaptive-CCA / related-key /
#               known-key / forward / inverse / chosen-target / rogue-key / side-channel /
#               physical / social / implementation / protocol / quantum / statistical
# ============================================================
# ============================================================
# 一、子主题（知识块）
# ------------------------------------------------------------
# 子主题是「域」与「实体」之间的中间层——多层次展示的骨架。
# 粒度原则：一个子主题 = 一类**机制**（不是每一个算法各占一个子主题）。

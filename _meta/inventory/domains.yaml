  - id: crypto-classical-statistics
    title: 经典统计破译
    title_en: Classical Statistical Cryptanalysis
    summary: 以语言的统计规律（频率、重合、周期）为武器的破译方法，古典密码时代的主力。
    curated: true
  - id: crypto-crib-known-plaintext
    title: 已知明文与猜测明文
    title_en: Cribs and Known-Plaintext
    summary: 利用已知或可猜的明文片段反推密钥结构。
    curated: true
  - id: crypto-differential
    title: 差分密码分析
    title_en: Differential Cryptanalysis
    summary: 追踪输入差分如何穿透密码轮次，用统计偏置逼近密钥。
    curated: true
  - id: crypto-linear
    title: 线性密码分析
    title_en: Linear Cryptanalysis
    summary: 寻找明文、密文、密钥比特间的线性近似，累积偏置逐位还原密钥。
    curated: true
  - id: crypto-algebraic
    title: 代数密码分析
    title_en: Algebraic Cryptanalysis
    summary: 把密码系统建模为低次多项式方程组并求解。
    curated: true
  - id: crypto-integral
    title: 积分与高阶差分
    title_en: Integral and Higher-Order Differential Attacks
    summary: 用和集/积分性质与高阶差分恢复密钥。
    curated: true
  - id: crypto-structural
    title: 结构型攻击
    title_en: Structural Attacks
    summary: 攻击算法结构本身的弱点：boomerang、slide、rotational、biclique、invariant、impossible differential、truncated differential。
    curated: true
  - id: crypto-generic-composition
    title: 通用组合与搜索
    title_en: Generic Composition and Search Attacks
    summary: 与算法内部结构无关的通用手段：穷举、字典、彩虹表、meet-in-the-middle、生日碰撞、时间-存储权衡。
    curated: true
  - id: crypto-attack-models
    title: 攻击模型
    title_en: Attack Models
    summary: 攻击者被允许做什么——决定难度的前提框架。
    curated: true
  - id: crypto-machine-cryptanalysis
    title: 机器密码分析
    title_en: Machine Cryptanalysis
    summary: 针对具体密码机的统计与机械分析：Bombe、Banburismus、Zygalski 表、对角板。
    curated: true
  - id: crypto-side-channel
    title: 侧信道
    title_en: Side-Channel Attacks
    summary: 不攻数学、攻物理实现：时间、功耗、电磁、故障、冷启动、推测执行。
    curated: true
  - id: crypto-implementation
    title: 实现与实现型攻击
    title_en: Implementation Attacks
    summary: 攻实现的用法而非算法本身：填充预言、密钥混淆、nonce 复用、RNG 失效、后门。
    curated: true
  - id: crypto-protocol-network
    title: 协议与网络层攻击
    title_en: Protocol and Network Attacks
    summary: 攻协议与链路：中间人、重放、流量分析、降级、撞库。
    curated: true
  - id: crypto-social-engineering
    title: 社会工程
    title_en: Social Engineering
    summary: 攻人：钓鱼、喷洒、诱饵、肩窥、声学侧信道。
    curated: true
  - id: crypto-steganalysis
    title: 隐写分析
    title_en: Steganalysis
    summary: 检测与提取隐藏在无害载体中的消息。
    curated: true
  - id: crypto-quantum-attacks
    title: 量子攻击
    title_en: Quantum Attacks
    summary: Shor 与 Grover 及其对现有体系结构的冲击。
    curated: true
